# Builds the static site with Jaspr and publishes it on GitHub Pages.
#
# Runs on every push to main, and by hand from the Actions tab. No schedule:
# the download and star counts are read again by every visitor's browser, so
# the numbers baked into the HTML only matter for the first instant of a page
# load and for crawlers.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a build still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The same Flutter the site is built with locally.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install the Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.5

      - name: Get dependencies
        run: flutter pub get

      # Prints "[ERROR] Server process failed unexpectedly" at the end: that is
      # the pre-rendering server being stopped after both pages are written.
      # The command still exits with 0.
      - name: Build
        run: dart pub global run jaspr_cli:jaspr build

      # The map's Flutter view uses CanvasKit, served from the site: the
      # chromium build on Chrome and Edge, the plain one elsewhere. The other
      # renderers and the debug symbols are about 19 MB nobody downloads.
      - name: Drop unused renderers
        run: |
          cd build/jaspr/canvaskit
          rm -f skwasm* wimp* *.symbols chromium/*.symbols webparagraph/*.symbols

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
